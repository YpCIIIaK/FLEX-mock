  <main class="stub">

    <div class="blobs" aria-hidden="true">
      <div class="blob blob--purple">
        <span class="blob__ellipse blob__ellipse--1"></span>
        <span class="blob__ellipse blob__ellipse--2"></span>

      <div class="blob blob--blue">
        <span class="blob__ellipse blob__ellipse--1"></span>
        <span class="blob__ellipse blob__ellipse--2"></span>
        <span class="blob__ellipse blob__ellipse--3"></span>
        <span class="blob__ellipse blob__ellipse--4"></span>
        <span class="blob__ellipse blob__ellipse--5"></span>

    <div class="stub__logo">

    <div class="lang" role="group" aria-label="Язык / Тіл">

    <div class="drum" data-drum aria-live="polite">

    <div class="modal__dialog">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title" data-modal-title></h2>
        <button class="modal__close" type="button" aria-label="Закрыть" data-modal-close>
