<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FLEX — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="glow glow--violet" aria-hidden="true"></div>
      <div class="glow glow--blue" aria-hidden="true"></div>

      <header class="topbar">
        <img class="logo" src="/flex-logo.png" alt="FLEX" width="154" height="47" />
        <span class="badge">21+</span>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="eyebrow">Telegram Mini App</p>
        <h1 id="hero-title">Скоро здесь<br />появится FLEX</h1>
        <p class="lead">Готовим новый формат внутри Telegram. Быстрый, удобный и всегда под рукой.</p>
      </section>

      <section class="status" aria-label="Статус проекта">
        <span class="status__dot" aria-hidden="true"></span>
        <div>
          <strong>Мы работаем над запуском</strong>
          <p>Сообщим в боте, когда всё будет готово.</p>
        </div>
      </section>

      <footer class="footer">
        <p>Только для совершеннолетних пользователей 21+</p>
        <span id="telegram-status">Открыто в режиме предпросмотра</span>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
