<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FLEX — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="glow glow--violet" aria-hidden="true"></div>
      <div class="glow glow--blue" aria-hidden="true"></div>
      <header class="topbar">
        <button class="brand" type="button" data-route="home" aria-label="На главную">
          <img src="/flex-logo.png" alt="FLEX" width="154" height="47" />
        </button>
        <div class="user-chip">
          <span class="user-chip__copy"><small>Добро пожаловать</small><strong data-user-name>Гость</strong></span>
          <span class="avatar" data-user-avatar>Г</span>
        </div>
      </header>
      <main class="view" id="app-view" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="nav-item is-active" type="button" data-route="home"><span class="nav-icon" aria-hidden="true">⌂</span><span>Главная</span></button>
        <button class="nav-item" type="button" data-route="catalog"><span class="nav-icon" aria-hidden="true">◇</span><span>Каталог</span></button>
        <button class="nav-item" type="button" data-route="profile"><span class="nav-icon" aria-hidden="true">○</span><span>Профиль</span></button>
      </nav>
    </div>
    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
